name: New rule or feature
description: A problem safe-anything should find, or something it should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What it should find or do
      description: The vulnerable pattern or misconfiguration, or the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Unsafe and safe examples
      description: A few lines that should be flagged, and a look-alike that shouldn't. Made-up values only.
      render: text
  - type: input
    id: reference
    attributes:
      label: Reference
      description: A CWE, an OWASP page, an advisory or a write-up, if you have one.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - "Yes, I can open a pull request"
        - "Maybe, with some guidance"
        - "No"
